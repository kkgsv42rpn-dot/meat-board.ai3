<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baruch Boards | Premium Kosher Meat Boards</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #070605;
  font-family: Arial, Helvetica, sans-serif;
}

canvas {
  display: block;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background:
    radial-gradient(
      circle at center,
      transparent 35%,
      rgba(0,0,0,.18) 65%,
      rgba(0,0,0,.75) 100%
    );
}

.brand {
  position: fixed;
  top: 38px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  text-align: center;
  color: white;
  pointer-events: none;
  width: 90%;
}

.brand-name {
  font-size: clamp(30px, 5vw, 58px);
  font-weight: 800;
  letter-spacing: .22em;
  text-shadow: 0 4px 30px rgba(0,0,0,.8);
}

.tagline {
  margin-top: 12px;
  font-size: clamp(10px, 1.4vw, 15px);
  letter-spacing: .28em;
  text-transform: uppercase;
  color: #d8c5aa;
}

.bottom {
  position: fixed;
  left: 50%;
  bottom: 42px;
  transform: translateX(-50%);
  z-index: 10;
  text-align: center;
  width: 90%;
  pointer-events: none;
}

.bottom-title {
  color: white;
  font-size: clamp(16px, 2vw, 24px);
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  text-shadow: 0 3px 20px black;
}

.bottom-subtitle {
  margin-top: 9px;
  color: #c4b49f;
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.loading {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #070605;
  color: #d8c5aa;
  font-size: 12px;
  letter-spacing: .25em;
  text-transform: uppercase;
  transition: opacity .8s ease;
}

.loading.hidden {
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="loading" id="loading">
  BARUCH BOARDS
</div>

<div class="overlay"></div>

<div class="brand">
  <div class="brand-name">BARUCH BOARDS</div>
  <div class="tagline">
    Exceptional Kosher. Unforgettable Boards.
  </div>
</div>

<div class="bottom">
  <div class="bottom-title">
    Premium Kosher Meat, Crafted Your Way
  </div>
  <div class="bottom-subtitle">
    Watch your board come together
  </div>
</div>

<script type="module">

import * as THREE from
"https://unpkg.com/three@0.166.1/build/three.module.js";

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x070605);

scene.fog = new THREE.FogExp2(
  0x070605,
  0.055
);

/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
  38,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(
  0,
  4.8,
  7.4
);

camera.lookAt(
  0,
  0,
  0
);

/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

document.body.appendChild(
  renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

const ambient = new THREE.HemisphereLight(
  0xffe8d0,
  0x080604,
  2.0
);

scene.add(ambient);


const keyLight =
  new THREE.DirectionalLight(
    0xffd6a8,
    5
  );

keyLight.position.set(
  4,
  8,
  5
);

keyLight.castShadow = true;

keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;

scene.add(keyLight);


const warmLight =
  new THREE.PointLight(
    0xff8c42,
    18,
    15
  );

warmLight.position.set(
  -4,
  3,
  -3
);

scene.add(warmLight);


const coolLight =
  new THREE.PointLight(
    0x8ba8ff,
    10,
    15
  );

coolLight.position.set(
  4,
  4,
  -4
);

scene.add(coolLight);

/* =========================================================
   FLOOR
========================================================= */

const floorGeometry =
  new THREE.PlaneGeometry(
    40,
    40
  );

const floorMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x100c08,
    roughness: 0.9,
    metalness: 0
  });

const floor =
  new THREE.Mesh(
    floorGeometry,
    floorMaterial
  );

floor.rotation.x =
  -Math.PI / 2;

floor.position.y =
  -0.35;

floor.receiveShadow = true;

scene.add(floor);

/* =========================================================
   BOARD
========================================================= */

const boardGroup =
  new THREE.Group();

scene.add(boardGroup);


const boardShape =
  new THREE.Shape();

const w = 4.5;
const h = 2.9;
const r = 0.35;

boardShape.moveTo(
  -w / 2 + r,
  -h / 2
);

boardShape.lineTo(
  w / 2 - r,
  -h / 2
);

boardShape.quadraticCurveTo(
  w / 2,
  -h / 2,
  w / 2,
  -h / 2 + r
);

boardShape.lineTo(
  w / 2,
  h / 2 - r
);

boardShape.quadraticCurveTo(
  w / 2,
  h / 2,
  w / 2 - r,
  h / 2
);

boardShape.lineTo(
  -w / 2 + r,
  h / 2
);

boardShape.quadraticCurveTo(
  -w / 2,
  h / 2,
  -w / 2,
  h / 2 - r
);

boardShape.lineTo(
  -w / 2,
  -h / 2 + r
);

boardShape.quadraticCurveTo(
  -w / 2,
  -h / 2,
  -w / 2 + r,
  -h / 2
);


const boardGeometry =
  new THREE.ExtrudeGeometry(
    boardShape,
    {
      depth: 0.28,
      bevelEnabled: true,
      bevelThickness: 0.08,
      bevelSize: 0.08,
      bevelSegments: 5
    }
  );

boardGeometry.rotateX(
  -Math.PI / 2
);


const boardMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x633c20,
    roughness: 0.65,
    metalness: 0
  });


const board =
  new THREE.Mesh(
    boardGeometry,
    boardMaterial
  );

board.castShadow = true;
board.receiveShadow = true;

board.position.y = 0;

boardGroup.add(board);


/* Board rim */

const rimGeometry =
  new THREE.BoxGeometry(
    4.15,
    0.08,
    2.55
  );

const rimMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x8a5a32,
    roughness: 0.5
  });

const rim =
  new THREE.Mesh(
    rimGeometry,
    rimMaterial
  );

rim.position.y = 0.18;

rim.castShadow = true;

boardGroup.add(rim);

/* =========================================================
   MATERIALS
========================================================= */

const steakMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x9f2727,
    roughness: 0.42
  });

const steakFat =
  new THREE.MeshStandardMaterial({
    color: 0xffd7bd,
    roughness: 0.5
  });

const darkMeatMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x4b2015,
    roughness: 0.8
  });

const pastramiMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x87352b,
    roughness: 0.55
  });

const salamiMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x762323,
    roughness: 0.5
  });

const pickleMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x718d2d,
    roughness: 0.4
  });

const oliveMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x1c2411,
    roughness: 0.3
  });

const mustardMaterial =
  new THREE.MeshStandardMaterial({
    color: 0xe3aa16,
    roughness: 0.35
  });

/* =========================================================
   ANIMATION OBJECTS
========================================================= */

const animatedPieces = [];


/* =========================================================
   CREATE STEAK
========================================================= */

function createSteak(
  x,
  z,
  scale = 1
) {

  const group =
    new THREE.Group();

  const geometry =
    new THREE.CylinderGeometry(
      0.43,
      0.43,
      0.13,
      48
    );

  geometry.scale(
    1.25,
    1,
    0.82
  );

  const steak =
    new THREE.Mesh(
      geometry,
      steakMaterial
    );

  steak.castShadow = true;

  group.add(steak);


  const fatGeometry =
    new THREE.TorusGeometry(
      0.13,
      0.035,
      10,
      30
    );

  const fat =
    new THREE.Mesh(
      fatGeometry,
      steakFat
    );

  fat.rotation.x =
    Math.PI / 2;

  fat.position.y =
    0.075;

  fat.position.x =
    0.05;

  group.add(fat);


  group.scale.setScalar(
    scale
  );

  addAnimatedPiece(
    group,
    x,
    z
  );
}


/* =========================================================
   CREATE PASTRAMI
========================================================= */

function createPastrami(
  x,
  z,
  rotation = 0
) {

  const group =
    new THREE.Group();

  const geometry =
    new THREE.CylinderGeometry(
      0.3,
      0.3,
      0.20,
      40
    );

  const meat =
    new THREE.Mesh(
      geometry,
      pastramiMaterial
    );

  meat.rotation.z =
    Math.PI / 2;

  meat.castShadow = true;

  group.add(meat);

  group.rotation.y =
    rotation;

  addAnimatedPiece(
    group,
    x,
    z
  );
}


/* =========================================================
   CREATE SALAMI
========================================================= */

function createSalami(
  x,
  z
) {

  const geometry =
    new THREE.CylinderGeometry(
      0.20,
      0.20,
      0.075,
      40
    );

  const meat =
    new THREE.Mesh(
      geometry,
      salamiMaterial
    );

  meat.position.set(
    x,
    0.38,
    z
  );

  meat.castShadow = true;

  scene.add(meat);

  animatedPieces.push({
    object: meat,
    target: new THREE.Vector3(
      x,
      0.38,
      z
    ),
    start: new THREE.Vector3(
      x * 1.8,
      2.2,
      z * 1.8
    ),
    delay: animatedPieces.length * 0.08
  });

  meat.position.copy(
    animatedPieces[
      animatedPieces.length - 1
    ].start
  );
}


/* =========================================================
   CREATE PICKLE
========================================================= */

function createPickle(
  x,
  z,
  rotation
) {

  const geometry =
    new THREE.CapsuleGeometry(
      0.10,
      0.65,
      8,
      16
    );

  const pickle =
    new THREE.Mesh(
      geometry,
      pickleMaterial
    );

  pickle.rotation.z =
    Math.PI / 2;

  pickle.rotation.y =
    rotation;

  pickle.castShadow = true;

  addAnimatedPiece(
    pickle,
    x,
    z
  );
}


/* =========================================================
   CREATE OLIVE
========================================================= */

function createOlive(
  x,
  z
) {

  const geometry =
    new THREE.SphereGeometry(
      0.10,
      24,
      18
    );

  const olive =
    new THREE.Mesh(
      geometry,
      oliveMaterial
    );

  olive.castShadow = true;

  addAnimatedPiece(
    olive,
    x,
    z
  );
}


/* =========================================================
   CREATE MUSTARD BOWL
========================================================= */

function createMustard(
  x,
  z
) {

  const group =
    new THREE.Group();


  const bowl =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.30,
        0.23,
        0.20,
        32
      ),
      new THREE.MeshStandardMaterial({
        color: 0xe8e0d0,
        roughness: 0.35
      })
    );

  bowl.castShadow = true;

  group.add(bowl);


  const mustard =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.22,
        32,
        16
      ),
      mustardMaterial
    );

  mustard.scale.y =
    0.35;

  mustard.position.y =
    0.12;

  group.add(mustard);


  addAnimatedPiece(
    group,
    x,
    z
  );
}


/* =========================================================
   ANIMATION SYSTEM
========================================================= */

function addAnimatedPiece(
  object,
  x,
  z
) {

  const target =
    new THREE.Vector3(
      x,
      0.38,
      z
    );

  const start =
    new THREE.Vector3(
      x * 1.9,
      2.8 + Math.random() * 1.5,
      z * 1.9
    );

  object.position.copy(
    start
  );

  scene.add(object);

  animatedPieces.push({
    object,
    target,
    start,
    delay:
      animatedPieces.length * 0.16,
    duration:
      1.5 + Math.random() * 0.5,
    rotation:
      (Math.random() - 0.5) * 5,
    finished: false
  });
}


/* =========================================================
   BUILD THE BOARD
========================================================= */

/* Main steaks */

createSteak(
  -0.65,
  0.05,
  1.0
);

createSteak(
  0.05,
  0.02,
  1.0
);

createSteak(
  0.72,
  0.05,
  0.95
);


/* Pastrami */

createPastrami(
  1.20,
  0.72,
  0.4
);

createPastrami(
  0.95,
  0.88,
  -0.3
);


/* Salami */

createSalami(
  -1.45,
  -0.65
);

createSalami(
  -1.10,
  -0.75
);

createSalami(
  -0.78,
  -0.78
);

createSalami(
  -0.45,
  -0.78
);


/* Pickles */

createPickle(
  0.75,
  -0.75,
  -0.2
);

createPickle(
  1.05,
  -0.55,
  0.3
);


/* Olives */

createOlive(
  -1.25,
  0.55
);

createOlive(
  -1.00,
  0.72
);

createOlive(
  -0.72,
  0.62
);

createOlive(
  -0.45,
  0.72
);


/* Mustard */

createMustard(
  1.45,
  -0.65
);


/* =========================================================
   INTRO ANIMATION
========================================================= */

const startTime =
  performance.now();

let boardRotation = 0;

function animate() {

  requestAnimationFrame(
    animate
  );

  const now =
    performance.now();

  const elapsed =
    (now - startTime) / 1000;


  /* Pieces flying onto board */

  for (
    let i = 0;
    i < animatedPieces.length;
    i++
  ) {

    const piece =
      animatedPieces[i];

    const localTime =
      elapsed -
      piece.delay;

    if (
      localTime <= 0
    ) {
      continue;
    }

    const progress =
      Math.min(
        localTime /
        piece.duration,
        1
      );

    /* Smooth easing */

    const eased =
      1 -
      Math.pow(
        1 - progress,
        4
      );

    piece.object.position.lerpVectors(
      piece.start,
      piece.target,
      eased
    );

    /* Bounce */

    if (
      progress < 1
    ) {

      piece.object.position.y =
        piece.start.y +
        (
          piece.target.y -
          piece.start.y
        ) * eased +
        Math.sin(
          progress * Math.PI
        ) * 0.45;

      piece.object.rotation.y =
        piece.rotation *
        (1 - eased);
    }

    else {

      piece.object.position.copy(
        piece.target
      );

      piece.object.rotation.y =
        0;

      piece.finished = true;
    }
  }


  /* Slow camera movement */

  const cameraTime =
    elapsed * 0.22;

  camera.position.x =
    Math.sin(cameraTime) *
    0.55;

  camera.position.z =
    7.2 +
    Math.cos(cameraTime) *
    0.35;

  camera.position.y =
    4.6 +
    Math.sin(
      cameraTime * 0.7
    ) * 0.15;

  camera.lookAt(
    0,
    0.25,
    0
  );


  /* Board slowly rotates */

  boardRotation +=
    0.0007;

  boardGroup.rotation.y =
    Math.sin(
      boardRotation
    ) * 0.035;


  /* Lights move slightly */

  warmLight.position.x =
    Math.sin(elapsed * 0.4) * 4;

  coolLight.position.x =
    Math.cos(elapsed * 0.35) * 4;


  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )
    );
  }
);


/* =========================================================
   START
========================================================= */

setTimeout(() => {

  const loading =
    document.getElementById(
      "loading"
    );

  loading.classList.add(
    "hidden"
  );

}, 700);

animate();

</script>

</body>
</html>
