<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOARDS BY BARUCH — 3D TEST</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.min.js"></script>

<script>

const canvas = document.getElementById("canvas");

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;


/* SCENE */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x080706);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(
    0,
    3,
    7
);

camera.lookAt(
    0,
    0,
    0
);


/* LIGHT */

const light = new THREE.DirectionalLight(
    0xffffff,
    4
);

light.position.set(
    -4,
    7,
    5
);

scene.add(light);


const fill = new THREE.AmbientLight(
    0xffffff,
    1.5
);

scene.add(fill);


/* BOARD */

const board = new THREE.Mesh(

    new THREE.BoxGeometry(
        5,
        .35,
        3
    ),

    new THREE.MeshStandardMaterial({
        color:0x75451f,
        roughness:.55
    })

);

board.position.y = -1;

scene.add(board);


/* STEAK */

const steak = new THREE.Mesh(

    new THREE.CylinderGeometry(
        .8,
        .9,
        .28,
        48
    ),

    new THREE.MeshStandardMaterial({
        color:0x8d2819,
        roughness:.3
    })

);

steak.rotation.x =
    Math.PI / 2;

steak.position.set(
    -1,
    1.5,
    0
);

scene.add(steak);


/* SECOND STEAK */

const steak2 = steak.clone();

steak2.position.set(
    1,
    2.1,
    -.2
);

steak2.rotation.z=.4;

scene.add(steak2);


/* ANIMATION */

function animate(){

    requestAnimationFrame(
        animate
    );

    steak.rotation.z += .004;

    steak2.rotation.z -= .003;

    renderer.render(
        scene,
        camera
    );
}

animate();


/* RESIZE */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
