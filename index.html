<html lang="en">
<head>
<meta charset="utf-8" />

<style>

  #vignette {

  }

    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    font: 600 10px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .42em; text-transform: uppercase; color: #a89684;
    opacity: .4; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hint">Kosher Meat Board</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ *
 *  Deterministic pseudo-random
 * ------------------------------------------------------------------ */
let _seed = 0x9e3779b9;
function rand() {
  _seed |= 0; _seed = (_seed + 0x6d2b79f5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rnd = (a, b) => a + (b - a) * rand();
const lerp = THREE.MathUtils.lerp;
const easeInOutCubic = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeInOutSine  = p => 0.5 - 0.5 * Math.cos(Math.PI * p);

/* ------------------------------------------------------------------ *
 *  Renderer / scene / camera
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.FogExp2(0x070810, 0.032);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 90);
const camTarget = new THREE.Vector3(0, 0.10, 0.02);
camera.position.set(-3.2, 2.4, 4.1);
camera.lookAt(camTarget);

/* Soft studio environment for PBR reflections (procedural, no HDR file) */
const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;
scene.environmentIntensity = 0.30;
pmrem.dispose();

/* ------------------------------------------------------------------ *
 *  Cyclorama backdrop + dark studio table
 * ------------------------------------------------------------------ */
const backdrop = new THREE.Mesh(
  new THREE.SphereGeometry(38, 32, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop:    { value: new THREE.Color(0x1b1f27) },
      uBottom: { value: new THREE.Color(0x030407) },
      uGlow:   { value: new THREE.Color(0x402a15) }
    },
    vertexShader: /* glsl */`
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vPos;
      uniform vec3 uTop, uBottom, uGlow;
      void main() {
        vec3 d = normalize(vPos);
        float h = smoothstep(-0.65, 0.95, d.y);
        vec3 col = mix(uBottom, uTop, h);
        float pool = pow(max(0.0, dot(d, normalize(vec3(-0.25, 0.18, -1.0)))), 5.0);
        col += uGlow * pool * 0.75;
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
scene.add(backdrop);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x090a0d, roughness: 0.92, metalness: 0.0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.306;
floor.receiveShadow = true;
scene.add(floor);

/* ------------------------------------------------------------------ *
 *  Lighting — warm key + two cold/warm rims
 * ------------------------------------------------------------------ */
const key = new THREE.SpotLight(0xffe8cd, 52, 18, 0.60, 1.0, 2.0);
key.position.set(2.6, 5.2, 3.6);
key.target.position.set(-0.05, 0.0, -0.05);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0008;
key.shadow.normalBias = 0.022;
key.shadow.radius = 3;
key.shadow.camera.near = 1.5;
key.shadow.camera.far = 18;
scene.add(key, key.target);

const rimWarm = new THREE.SpotLight(0xffb066, 80, 16, 0.85, 1.0, 2.0);
rimWarm.position.set(-4.3, 2.1, -3.4);
rimWarm.target.position.set(0, 0.05, 0);
scene.add(rimWarm, rimWarm.target);

const rimCool = new THREE.SpotLight(0x9dc4ff, 62, 16, 0.85, 1.0, 2.0);
rimCool.position.set(4.4, 2.8, -3.8);
rimCool.target.position.set(0, 0.05, 0);
scene.add(rimCool, rimCool.target);

scene.add(new THREE.HemisphereLight(0x2b3345, 0x07070a, 0.45));

const bounce = new THREE.DirectionalLight(0x5c4a34, 0.22);
bounce.position.set(-1.2, -1.0, 2.0);
scene.add(bounce);

/* ------------------------------------------------------------------ *
 *  Canvas texture helpers
 * ------------------------------------------------------------------ */
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c, x: c.getContext('2d') };
}
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
function tex(canvas, { srgb = true, repeat = null } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = Math.min(8, MAX_ANISO);
  t.needsUpdate = true;
  return t;
}

/* ---- hardwood ---- */
function woodCanvas() {
  const W = 1400, H = 700;
  const { c, x } = mk(W, H);
  const base = x.createLinearGradient(0, 0, 0, H);
  base.addColorStop(0.00, '#6c4627');
  base.addColorStop(0.18, '#7d532d');
  base.addColorStop(0.42, '#5c391d');
  base.addColorStop(0.63, '#764c29');
  base.addColorStop(0.82, '#4b2e17');
  base.addColorStop(1.00, '#382211');
  x.fillStyle = base; x.fillRect(0, 0, W, H);

  for (let i = 0; i < 64; i++) {
    const y = rand() * H, hh = 6 + rand() * 80;
    x.fillStyle = rand() < 0.55
      ? `rgba(34,18,8,${0.02 + rand() * 0.055})`
      : `rgba(178,126,76,${0.015 + rand() * 0.045})`;
    x.fillRect(0, y, W, hh);
  }

  for (let i = 0; i < 1500; i++) {
    const y0 = rand() * H;
    const amp = 2 + rand() * 12;
    const freq = 0.0015 + rand() * 0.012;
    const ph = rand() * Math.PI * 2;
    x.beginPath();
    for (let px = 0; px <= W; px += 6) {
      const yy = y0 + Math.sin(px * freq + ph) * amp + Math.sin(px * freq * 3.7 + ph * 2.1) * amp * 0.28;
      px === 0 ? x.moveTo(px, yy) : x.lineTo(px, yy);
    }
    x.strokeStyle = rand() < 0.62
      ? `rgba(27,14,6,${0.04 + rand() * 0.17})`
      : `rgba(198,144,90,${0.02 + rand() * 0.08})`;
    x.lineWidth = 0.5 + rand() * 2.6;
    x.stroke();
  }

  for (let k = 0; k < 6; k++) {
    const cx = rand() * W, cy = rand() * H;
    for (let r = 2; r < 26; r += 2.2) {
      x.beginPath();
      x.ellipse(cx, cy, r * 2.6, r, 0, 0, Math.PI * 2);
      x.strokeStyle = `rgba(30,16,7,${Math.max(0, 0.16 - r * 0.004)})`;
      x.lineWidth = 1.4;
      x.stroke();
    }
  }

  for (let i = 0; i < 12000; i++) {
    x.fillStyle = rand() < 0.5 ? 'rgba(0,0,0,0.05)' : 'rgba(255,226,190,0.035)';
    x.fillRect(rand() * W, rand() * H, 1, 1);
  }
  return c;
}

/* ---- rib-eye face: marbled muscle ---- */
function marbleCanvas() {
  const W = 768, H = 768;
  const { c, x } = mk(W, H);
  const g = x.createRadialGradient(W * 0.42, H * 0.38, 30, W * 0.5, H * 0.5, W * 0.62);
  g.addColorStop(0, '#b34a4e');
  g.addColorStop(0.45, '#96343b');
  g.addColorStop(1, '#6a1f26');
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  for (let i = 0; i < 2600; i++) {
    const px = rand() * W, py = rand() * H;
    x.strokeStyle = `rgba(${190 + rand() * 50 | 0},${72 + rand() * 45 | 0},${76 + rand() * 40 | 0},${0.03 + rand() * 0.09})`;
    x.lineWidth = 0.6 + rand() * 1.3;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-4, 4), py + rnd(8, 34)); x.stroke();
  }

  x.lineCap = 'round';
  for (let i = 0; i < 95; i++) {
    let px = rand() * W, py = rand() * H;
    x.beginPath(); x.moveTo(px, py);
    for (let s = 0; s < 5; s++) {
      const cx1 = px + rnd(-90, 90), cy1 = py + rnd(-90, 90);
      px = cx1 + rnd(-80, 80); py = cy1 + rnd(-80, 80);
      x.quadraticCurveTo(cx1, cy1, px, py);
    }
    x.strokeStyle = `rgba(255,${226 + rand() * 20 | 0},${216 + rand() * 24 | 0},${0.10 + rand() * 0.32})`;
    x.lineWidth = 1.2 + rand() * 5.5;
    x.stroke();
    x.strokeStyle = 'rgba(255,214,200,0.06)';
    x.lineWidth += 5.5;
    x.stroke();
  }

  for (let i = 0; i < 700; i++) {
    x.fillStyle = `rgba(28,10,8,${0.05 + rand() * 0.3})`;
    x.fillRect(rand() * W, rand() * H, 1 + rand() * 2, 1 + rand() * 2);
  }
  return c;
}

/* ---- pepper crust ---- */
function crustCanvas() {
  const W = 512, H = 512;
  const { c, x } = mk(W, H);
  x.fillStyle = '#2a1a10'; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 4200; i++) {
    const r = 0.7 + rand() * 2.6;
    x.fillStyle = rand() < 0.55
      ? `rgba(${10 + rand() * 30 | 0},${8 + rand() * 20 | 0},${6 + rand() * 15 | 0},${0.5 + rand() * 0.5})`
      : `rgba(${92 + rand() * 68 | 0},${62 + rand() * 48 | 0},${42 + rand() * 38 | 0},${0.25 + rand() * 0.4})`;
    x.beginPath(); x.arc(rand() * W, rand() * H, r, 0, Math.PI * 2); x.fill();
  }
  for (let i = 0; i < 240; i++) {
    x.fillStyle = 'rgba(242,238,228,0.85)';
    x.fillRect(rand() * W, rand() * H, 1.6, 1.6);
  }
  return c;
}

/* ---- salami face ---- */
function salamiCanvas() {
  const W = 512, H = 512;
  const { c, x } = mk(W, H);
  x.fillStyle = '#7d2a2a'; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, W * 0.55);
  g.addColorStop(0, '#97433d');
  g.addColorStop(1, '#6b2121');
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  for (let i = 0; i < 2000; i++) {
    const r = 0.8 + rand() * 3.4;
    x.fillStyle = `rgba(${232 + rand() * 23 | 0},${216 + rand() * 24 | 0},${198 + rand() * 28 | 0},${0.45 + rand() * 0.5})`;
    x.beginPath(); x.arc(rand() * W, rand() * H, r, 0, Math.PI * 2); x.fill();
  }
  for (let i = 0; i < 900; i++) {
    x.fillStyle = `rgba(58,12,12,${0.1 + rand() * 0.3})`;
    x.beginPath(); x.arc(rand() * W, rand() * H, 0.6 + rand() * 1.6, 0, Math.PI * 2); x.fill();
  }
  return c;
}

/* ---- smoked bark (brisket / pastrami exterior) ---- */
function barkCanvas() {
  const W = 512, H = 512;
  const { c, x } = mk(W, H);
  x.fillStyle = '#3b1e10'; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 920; i++) {
    x.beginPath();
    x.ellipse(rand() * W, rand() * H, 3 + rand() * 22, 1.5 + rand() * 20, rand() * 3, 0, Math.PI * 2);
    x.fillStyle = rand() < 0.5
      ? `rgba(18,8,4,${0.06 + rand() * 0.18})`
      : `rgba(126,66,32,${0.04 + rand() * 0.14})`;
    x.fill();
  }
  for (let i = 0; i < 1700; i++) {
    x.fillStyle = `rgba(0,0,0,${0.15 + rand() * 0.5})`;
    x.beginPath(); x.arc(rand() * W, rand() * H, 0.6 + rand() * 1.8, 0, Math.PI * 2); x.fill();
  }
  for (let i = 0; i < 320; i++) {
    x.fillStyle = 'rgba(226,220,206,0.6)';
    x.fillRect(rand() * W, rand() * H, 1.3, 1.3);
  }
  return c;
}

/* ---- pastrami roll spiral ---- */
function swirlCanvas() {
  const W = 512, H = 512;
  const { c, x } = mk(W, H);
  const cx = W / 2, cy = H / 2;
  x.fillStyle = '#6d2b28'; x.fillRect(0, 0, W, H);

  const maxR = W * 0.50;
  for (let r = maxR; r > 2; r -= 1.4) {
    const light = 0.5 + 0.5 * Math.sin(r * 0.55);
    x.beginPath();
    x.arc(cx, cy, r, 0, Math.PI * 2);
    x.strokeStyle = `rgb(${124 + light * 44 | 0},${50 + light * 28 | 0},${44 + light * 24 | 0})`;
    x.lineWidth = 1.7;
    x.stroke();
  }

  x.beginPath();
  x.arc(cx, cy, maxR * 0.955, 0, Math.PI * 2);
  x.strokeStyle = 'rgba(26,15,9,0.85)';
  x.lineWidth = 11;
  x.stroke();

  for (let i = 0; i < 1500; i++) {
    const a = rand() * Math.PI * 2;
    const r = Math.sqrt(rand()) * maxR * 0.92;
    x.fillStyle = `rgba(242,230,214,${0.35 + rand() * 0.5})`;
    x.beginPath(); x.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 0.7 + rand() * 2.6, 0, Math.PI * 2); x.fill();
  }

  x.beginPath();
  for (let a = 0; a < Math.PI * 14; a += 0.05) {
    const r = 6 + a * 6.0;
    if (r > maxR * 0.94) break;
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    a === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
  }
  x.strokeStyle = 'rgba(38,14,12,0.55)';
  x.lineWidth = 2.2;
  x.stroke();
  return c;
}

/* ---- kielbasa face ---- */
function kielbasaCanvas() {
  const W = 512, H = 512;
  const { c, x } = mk(W, H);
  const g = x.createRadialGradient(W * 0.45, H * 0.4, 20, W * 0.5, H * 0.5, W * 0.6);
  g.addColorStop(0, '#c8675e');
  g.addColorStop(0.68, '#a9453f');
  g.addColorStop(1, '#8a3631');
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  for (let i = 0; i < 1200; i++) {
    x.fillStyle = `rgba(250,241,233,${0.25 + rand() * 0.55})`;
    x.beginPath(); x.arc(rand() * W, rand() * H, 0.8 + rand() * 3.2, 0, Math.PI * 2); x.fill();
  }
  for (let i = 0; i < 90; i++) {
    x.fillStyle = `rgba(122,42,42,${0.1 + rand() * 0.2})`;
    x.beginPath(); x.arc(rand() * W, rand() * H, 4 + rand() * 14, 0, Math.PI * 2); x.fill();
  }
  return c;
}

/* ---- beef jerky ---- */
function jerkyCanvas() {
  const W = 512, H = 512;
  const { c, x } = mk(W, H);
  x.fillStyle = '#47251a'; x.fillRect(0, 0, W, H);

  for (let i = 0; i < 1900; i++) {
    const px = rand() * W, py = rand() * H;
    x.strokeStyle = rand() < 0.6
      ? `rgba(26,11,7,${0.08 + rand() * 0.25})`
      : `rgba(152,86,48,${0.05 + rand() * 0.18})`;
    x.lineWidth = 0.7 + rand() * 2.2;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-3, 3), py + rnd(10, 40)); x.stroke();
  }
  for (let i = 0; i < 460; i++) {
    x.fillStyle = `rgba(12,6,4,${0.2 + rand() * 0.45})`;
    x.beginPath(); x.arc(rand() * W, rand() * H, 1 + rand() * 4, 0, Math.PI * 2); x.fill();
  }
  for (let i = 0; i < 620; i++) {
    x.fillStyle = `rgba(216,142,82,${0.06 + rand() * 0.14})`;
    x.fillRect(rand() * W, rand() * H, 1 + rand() * 3, 1 + rand() * 2);
  }
  return c;
}

/* ---- pickle skin ---- */
function pickleCanvas() {
  const W = 512, H = 512;
  const { c, x } = mk(W, H);
  x.fillStyle = '#5d7a2a'; x.fillRect(0, 0, W, H);

  for (let i = 0; i < 760; i++) {
    x.beginPath();
    x.ellipse(rand() * W, rand() * H, 4 + rand() * 26, 3 + rand() * 20, rand() * 3, 0, Math.PI * 2);
    x.fillStyle = rand() < 0.5
      ? `rgba(124,154,60,${0.05 + rand() * 0.16})`
      : `rgba(44,60,17,${0.05 + rand() * 0.2})`;
    x.fill();
  }
  for (let i = 0; i < 900; i++) {
    const px = rand() * W, py = rand() * H, r = 1 + rand() * 4.2;
    const g = x.createRadialGradient(px - r * 0.4, py - r * 0.4, 0.2, px, py, r);
    g.addColorStop(0, 'rgba(200,216,136,0.75)');
    g.addColorStop(1, 'rgba(120,150,60,0)');
    x.fillStyle = g;
    x.beginPath(); x.arc(px, py, r, 0, Math.PI * 2); x.fill();
  }
  return c;
}

/* ---- generic micro-noise (bump for olives etc.) ---- */
function noiseCanvas() {
  const W = 256, H = 256;
  const { c, x } = mk(W, H);
  const img = x.createImageData(W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = 128 + (rand() - 0.5) * 80;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}

/* ------------------------------------------------------------------ *
 *  Textures
 * ------------------------------------------------------------------ */
const woodC   = woodCanvas();
const marbleC = marbleCanvas();
const crustC  = crustCanvas();
const salamiC = salamiCanvas();
const barkC   = barkCanvas();
const swirlC  = swirlCanvas();
const kielC   = kielbasaCanvas();
const jerkyC  = jerkyCanvas();
const pickleC = pickleCanvas();
const noiseC  = noiseCanvas();

const T = {
  wood:       tex(woodC,   { repeat: [0.55, 0.55] }),
  woodBump:   tex(woodC,   { srgb: false, repeat: [0.55, 0.55] }),
  marble:     tex(marbleC),
  marbleBump: tex(marbleC, { srgb: false }),
  crust:      tex(crustC),
  crustBump:  tex(crustC,  { srgb: false }),
  salami:     tex(salamiC),
  bark:       tex(barkC),
  barkBump:   tex(barkC,   { srgb: false }),
  swirl:      tex(swirlC),
  kiel:       tex(kielC),
  jerky:      tex(jerkyC),
  jerkyBump:  tex(jerkyC,  { srgb: false }),
  pickle:     tex(pickleC),
  pickleBump: tex(pickleC, { srgb: false }),
  noise:      tex(noiseC,  { srgb: false, repeat: [3, 3] })
};

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const M = {};

M.board = new THREE.MeshPhysicalMaterial({
  map: T.wood, bumpMap: T.woodBump, bumpScale: 0.03,
  roughnessMap: T.woodBump, roughness: 0.78, metalness: 0.0,
  clearcoat: 0.32, clearcoatRoughness: 0.45,
  envMapIntensity: 0.85
});

M.ribFace = new THREE.MeshPhysicalMaterial({
  map: T.marble, bumpMap: T.marbleBump, bumpScale: 0.012,
  roughness: 0.40, metalness: 0.0,
  clearcoat: 0.55, clearcoatRoughness: 0.28,
  sheen: 0.45, sheenColor: new THREE.Color('#c85a52'), sheenRoughness: 0.65,
  envMapIntensity: 0.8
});

M.crust = new THREE.MeshStandardMaterial({
  map: T.crust, bumpMap: T.crustBump, bumpScale: 0.02,
  roughness: 0.95, metalness: 0.0, envMapIntensity: 0.5
});

M.bark = new THREE.MeshStandardMaterial({
  map: T.bark, bumpMap: T.barkBump, bumpScale: 0.022,
  color: 0xb08a72, roughness: 0.88, metalness: 0.0, envMapIntensity: 0.6
});

M.pastramiSide = new THREE.MeshStandardMaterial({
  map: T.bark, bumpMap: T.barkBump, bumpScale: 0.02,
  color: 0x8a5a44, roughness: 0.9, envMapIntensity: 0.55
});

M.pastramiFace = new THREE.MeshPhysicalMaterial({
  map: T.swirl, bumpMap: T.swirl, bumpScale: 0.01,
  roughness: 0.52, clearcoat: 0.35, clearcoatRoughness: 0.4,
  envMapIntensity: 0.75
});

M.salami = new THREE.MeshPhysicalMaterial({
  map: T.salami, roughness: 0.48, clearcoat: 0.35, clearcoatRoughness: 0.45,
  envMapIntensity: 0.75
});

M.casingDark = new THREE.MeshPhysicalMaterial({
  color: 0x4a1a14, roughness: 0.36, metalness: 0.0,
  clearcoat: 0.75, clearcoatRoughness: 0.3, envMapIntensity: 0.9
});

M.kielbasa = new THREE.MeshPhysicalMaterial({
  map: T.kiel, roughness: 0.45, clearcoat: 0.5, clearcoatRoughness: 0.35,
  envMapIntensity: 0.8
});

M.jerky = new THREE.MeshStandardMaterial({
  map: T.jerky, bumpMap: T.jerkyBump, bumpScale: 0.02,
  roughness: 1.0, metalness: 0.0, envMapIntensity: 0.35
});

M.pickle = new THREE.MeshPhysicalMaterial({
  map: T.pickle, bumpMap: T.pickleBump, bumpScale: 0.014,
  roughness: 0.22, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.14,
  sheen: 0.25, sheenColor: new THREE.Color('#cfe08a'), sheenRoughness: 0.6,
  envMapIntensity: 1.1
});

M.oliveGreen = new THREE.MeshPhysicalMaterial({
  color: 0x7f9d36, bumpMap: T.noise, bumpScale: 0.006,
  roughness: 0.20, clearcoat: 1.0, clearcoatRoughness: 0.12,
  sheen: 0.3, sheenColor: new THREE.Color('#c2d96a'),
  envMapIntensity: 1.0
});

M.oliveBlack = new THREE.MeshPhysicalMaterial({
  color: 0x241c26, bumpMap: T.noise, bumpScale: 0.006,
  roughness: 0.26, clearcoat: 1.0, clearcoatRoughness: 0.16,
  sheen: 0.35, sheenColor: new THREE.Color('#6d5f74'),
  envMapIntensity: 1.1
});

M.ceramic = new THREE.MeshPhysicalMaterial({
  color: 0xcfc6b6, roughness: 0.34, metalness: 0.0,
  clearcoat: 0.35, clearcoatRoughness: 0.3, envMapIntensity: 0.9,
  side: THREE.DoubleSide
});

M.mustard = new THREE.MeshPhysicalMaterial({
  color: 0xdda716, roughness: 0.34, metalness: 0.0,
  clearcoat: 0.6, clearcoatRoughness: 0.22,
  sheen: 0.25, sheenColor: new THREE.Color('#ffe27a'),
  envMapIntensity: 0.9

/* ------------------------------------------------------------------ *
 *  Hardwood board
 * ------------------------------------------------------------------ */
function roundedRectShape(w, d, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r);
  s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d);
  s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

const BOARD_W = 3.4, BOARD_D = 2.2, BOARD_H = 0.26;

const boardGeo = new THREE.ExtrudeGeometry(roundedRectShape(BOARD_W, BOARD_D, 0.16), {
  depth: BOARD_H,
  bevelEnabled: true,
  bevelThickness: 0.022,
  bevelSize: 0.022,
  bevelSegments: 4,
  curveSegments: 18
});
boardGeo.rotateX(-Math.PI / 2);
boardGeo.computeBoundingBox();
boardGeo.translate(0, -boardGeo.boundingBox.max.y, 0);
boardGeo.computeVertexNormals();

const board = new THREE.Mesh(boardGeo, M.board);
board.castShadow = true;
board.receiveShadow = true;
scene.add(board);

/* ------------------------------------------------------------------ *
 *  Food builders
 * ------------------------------------------------------------------ */
function shadowed(obj) {
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return obj;
}
function restOnBoard(geo) {
  geo.computeBoundingBox();
  geo.translate(0, -geo.boundingBox.min.y, 0);
  return geo;
}

/* — pepper-crusted rib eye slice — */
function buildRibEye() {
  const r = 0.30;
  const g = new THREE.CylinderGeometry(r, r * 0.97, 0.055, 56, 1, false);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const a = Math.atan2(v.z, v.x);
    const f = 1 + 0.045 * Math.sin(a * 3 + 0.7) + 0.03 * Math.sin(a * 7 - 1.2) + 0.018 * Math.sin(a * 11 + 2.1);
    v.x *= f; v.z *= f;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.scale(1.14, 1, 0.96);
  restOnBoard(g);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, [M.crust, M.ribFace, M.ribFace]);
  return shadowed(mesh);
}

/* — folded brisket slab — */
function buildBrisket() {
  const g = new THREE.BoxGeometry(0.70, 0.075, 0.40, 44, 1, 14);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const s = x * 9.2 + 0.5;
    const fold = 0.105 * Math.sin(s) + 0.028 * Math.sin(s * 2.3 + 1.1) + 0.012 * Math.sin(z * 6.0);
    pos.setY(i, y + fold);
  }
  g.computeVertexNormals();
  restOnBoard(g);
  const mesh = new THREE.Mesh(g, M.bark);
  return shadowed(mesh);
}

/* — rolled pastrami (axis along X, spiral faces visible) — */
function buildPastrami() {
  const g = new THREE.CylinderGeometry(0.215, 0.205, 0.44, 56, 1, false);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const a = Math.atan2(v.z, v.x);
    const f = 1 + 0.012 * Math.sin(a * 5 + 0.4) + 0.008 * Math.sin(a * 9);
    v.x *= f; v.z *= f;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.rotateZ(Math.PI / 2);
  restOnBoard(g);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, [M.pastramiSide, M.pastramiFace, M.pastramiFace]);
  return shadowed(mesh);
}

/* — kielbasa coin — */
function buildKielbasa() {
  const g = new THREE.CylinderGeometry(0.115, 0.112, 0.055, 40, 1, false);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const a = Math.atan2(v.z, v.x);
    const f = 1 + 0.02 * Math.sin(a * 4 + 1.1);
    v.x *= f; v.z *= f;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  restOnBoard(g);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, [M.casingDark, M.kielbasa, M.kielbasa]);
  return shadowed(mesh);
}

/* — aged salami round — */
function buildSalami() {
  const g = new THREE.CylinderGeometry(0.155, 0.152, 0.038, 44, 1, false);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const a = Math.atan2(v.z, v.x);
    const f = 1 + 0.018 * Math.sin(a * 5 - 0.6);
    v.x *= f; v.z *= f;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  restOnBoard(g);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, [M.casingDark, M.salami, M.salami]);
  return shadowed(mesh);
}

/* — jerky strip — */
function buildJerky() {
  const g = new THREE.BoxGeometry(0.48, 0.028, 0.175, 30, 1, 8);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const wave = 0.030 * Math.sin(x * 13.0 + 0.6) + 0.014 * Math.sin(z * 9.0);
    // ragged long edges
    const edge = Math.abs(z) > 0.08 ? 1 : 0.55;
    pos.setY(i, y + wave * edge);
    pos.setZ(i, z * (1 + 0.05 * Math.sin(x * 17.0)));
  }
  g.computeVertexNormals();
  restOnBoard(g);
  const mesh = new THREE.Mesh(g, M.jerky);
  return shadowed(mesh);
}

/* — whole pickle — */
function buildPickle() {
  const g = new THREE.CapsuleGeometry(0.072, 0.52, 10, 28);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const a = Math.atan2(v.z, v.x);
    const n = 0.6 * Math.sin(a * 9 + v.y * 13) + 0.4 * Math.sin(a * 17 - v.y * 9);
    const s = 1 + n * 0.05;
    v.x *= s; v.z *= s;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.rotateZ(Math.PI / 2);
  g.rotateY(0.06);
  restOnBoard(g);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, M.pickle);
  return shadowed(mesh);
}

/* — olive — */
function buildOlive(green) {
  const g = new THREE.SphereGeometry(0.072, 26, 18);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const s = 1 + 0.035 * Math.sin(v.x * 40) * Math.cos(v.z * 37);
    pos.setXYZ(i, v.x * s, v.y * 0.87 * s, v.z * s);
  }
  g.computeVertexNormals();
  restOnBoard(g);
  const mesh = new THREE.Mesh(g, green ? M.oliveGreen : M.oliveBlack);
  return shadowed(mesh);
}

/* — mustard bowl + dollop — */
function buildMustardBowl() {
  const grp = new THREE.Group();

  const profile = [
    [0.000, 0.006], [0.130, 0.006], [0.206, 0.022], [0.262, 0.074],
    [0.288, 0.144], [0.292, 0.165], [0.272, 0.168], [0.266, 0.146],
    [0.242, 0.086], [0.185, 0.048], [0.090, 0.038], [0.000, 0.036]
  ].map(p => new THREE.Vector2(p[0], p[1]));

  const bowl = new THREE.Mesh(new THREE.LatheGeometry(profile, 64), M.ceramic);
  grp.add(bowl);

  const dollopProfile = [
    [0.000, 0.070], [0.090, 0.072], [0.150, 0.082], [0.176, 0.100],
    [0.170, 0.124], [0.135, 0.142], [0.070, 0.152], [0.030, 0.159],
    [0.000, 0.163]
  ].map(p => new THREE.Vector2(p[0], p[1]));

  const dollop = new THREE.Mesh(new THREE.LatheGeometry(dollopProfile, 52), M.mustard);
  dollop.rotation.y = 0.7;
  grp.add(dollop);

  return shadowed(grp);
}

/* ------------------------------------------------------------------ *
 *  Composition — flight / settle animation registry (order = landing order)
 * ------------------------------------------------------------------ */
const items = [];
let orderSeq = 0;

function addPiece(obj, opts = {}) {
  const {
    x = 0, z = 0, y = 0,
    yaw = 0, tiltX = 0, tiltZ = 0,
    gap = 0.33, lift = null, arc = null, dur = null
  } = opts;

  const idx = orderSeq++;
  const t0 = 0.75 + idx * gap;

  const ang = idx * 2.39996 + 0.35;
  const rad = 1.75 + (idx % 6) * 0.17 + rand() * 0.32;
  const hgt = lift !== null ? lift : 0.95 + rand() * 1.05;

  const item = {
    obj,
    basePos: new THREE.Vector3(Math.sin(ang) * rad, hgt, Math.cos(ang) * rad),
    startRotY: rnd(-0.25, 0.25),
    spin: rnd(-0.7, 0.7),
    phase: rand() * Math.PI * 2,
    t0,
    dur: dur !== null ? dur : 1.95 + rand() * 0.55,
    arc: arc !== null ? arc : 0.16 + rand() * 0.16,
    restPos: new THREE.Vector3(x, y, z),
    restRot: new THREE.Euler(tiltX, yaw, tiltZ)
  };

  obj.position.copy(item.basePos);
  obj.rotation.set(0, yaw, 0);
  scene.add(obj);
  items.push(item);
  return item;
}

/* --- landing sequence, deliberately ordered --- */

// anchor: mustard bowl
addPiece(buildMustardBowl(), { x: -1.16, z: 0.70, yaw: 0.42, arc: 0.10 });

// fanned salami rounds
addPiece(buildSalami(), { x: -1.32, z: -0.38, yaw: 0.55 });
addPiece(buildSalami(), { x: -1.05, z: -0.55, yaw: -0.32 });
addPiece(buildSalami(), { x: -1.22, z: -0.62, y: 0.040, yaw: 1.10, arc: 0.08 });

// kielbasa coins
addPiece(buildKielbasa(), { x: -0.58, z: -0.34, yaw: 0.22 });
addPiece(buildKielbasa(), { x: -0.33, z: -0.24, yaw: 1.42 });
addPiece(buildKielbasa(), { x: -0.62, z: -0.60, yaw: -0.62 });
addPiece(buildKielbasa(), { x: -0.36, z: -0.72, y: 0.056, yaw: 2.20 });

// jerky strips
addPiece(buildJerky(), { x: 0.28, z: -0.87, yaw: 0.34 });
addPiece(buildJerky(), { x: 0.62, z: -0.97, yaw: -0.36 });
addPiece(buildJerky(), { x: 0.06, z: -0.62, y: 0.030, yaw: 0.92 });

// rolled pastrami
addPiece(buildPastrami(), { x: 1.02, z: 0.36, yaw: -0.95, tiltZ: 0.0 });

// folded brisket
addPiece(buildBrisket(), { x: 0.80, z: -0.10, yaw: 0.26, tiltX: 0.03 });
addPiece(buildBrisket(), { x: 1.02, z: -0.72, yaw: -0.75, tiltX: -0.03 });

// whole pickles
addPiece(buildPickle(), { x: 0.60, z: 0.66, yaw: 0.22 });
addPiece(buildPickle(), { x: 0.98, z: 0.95, yaw: -0.16 });

// green olives
addPiece(buildOlive(true),  { x: -0.62, z: 0.90, yaw: 0.3, gap: 0.22, arc: 0.10 });
addPiece(buildOlive(true),  { x: -0.48, z: 0.99, yaw: 1.1, gap: 0.22, arc: 0.10 });
addPiece(buildOlive(true),  { x: -0.76, z: 0.76, yaw: 2.0, gap: 0.22, arc: 0.10 });

// black olives
addPiece(buildOlive(false), { x: -0.12, z: 0.86, yaw: 0.8, gap: 0.22, arc: 0.10 });
addPiece(buildOlive(false), { x: 0.02, z: 0.97, yaw: 1.7, gap: 0.22, arc: 0.10 });
addPiece(buildOlive(false), { x: -0.22, z: 0.72, yaw: 2.6, gap: 0.22, arc: 0.10 });

// hero: pepper-crusted rib eye slices last
addPiece(buildRibEye(), { x: -0.30, z: 0.16, yaw: 0.16, gap: 0.46, dur: 2.5, arc: 0.22 });
addPiece(buildRibEye(), { x: 0.16, z: 0.02, yaw: -0.38, gap: 0.46, dur: 2.5, arc: 0.22 });

const introEnd = items.reduce((m, it) => Math.max(m, it.t0 + it.dur), 0);
const introDur = introEnd + 0.35;

/* ------------------------------------------------------------------ *
 *  Post-processing — subtle depth of field
 * ------------------------------------------------------------------ */
let composer = null, bokehPass = null;
try {
  composer = new EffectComposer(renderer);
  composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  composer.setSize(window.innerWidth, window.innerHeight);
  composer.addPass(new RenderPass(scene, camera));

  bokehPass = new BokehPass(scene, camera, {
    focus: camera.position.distanceTo(camTarget),
    aperture: 0.0034,
    maxblur: 0.0036
  });
  if (bokehPass.uniforms && bokehPass.uniforms.aspect) {
    bokehPass.uniforms.aspect.value = camera.aspect;
  }
  composer.addPass(bokehPass);
  composer.addPass(new OutputPass());
} catch (err) {
  console.warn('Post-processing unavailable, falling back to direct render.', err);
  composer = null;
}

/* ------------------------------------------------------------------ *
 *  Camera rig — one slow deliberate orbit, finishing on the last settle
 * ------------------------------------------------------------------ */
const CAM = {
  az0: -0.95, az1: -0.16,
  pol0: 1.245, pol1: 1.135,
  r0: 6.05, r1: 5.28
};

const _camPos = new THREE.Vector3();
function orbitPos(az, pol, r, out) {
  const sp = Math.sin(pol);
  out.set(Math.sin(az) * sp * r, Math.cos(pol) * r, Math.cos(az) * sp * r);
  out.add(camTarget);
  return out;
}

const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
window.addEventListener('pointermove', e => {
  pointer.tx = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.ty = (e.clientY / window.innerHeight) * 2 - 1;
}, { passive: true });

function updateCamera(t, dt) {
  const p = Math.max(0, Math.min(1, t / introDur));
  const e = easeInOutSine(p);

  let az  = lerp(CAM.az0, CAM.az1, e);
  let pol = lerp(CAM.pol0, CAM.pol1, e);
  let r   = lerp(CAM.r0, CAM.r1, e);

  // gentle post-intro breathing + pointer parallax
  const k = Math.min(1, Math.max(0, (t - introDur + 2.0) / 2.5));
  az  += Math.sin(t * 0.23) * 0.016 * k + pointer.x * 0.085;
  pol += Math.sin(t * 0.17) * 0.010 * k + pointer.y * 0.055;
  r   += Math.sin(t * 0.13) * 0.05 * k;

  camera.position.copy(orbitPos(az, pol, r, _camPos));
  camera.lookAt(camTarget);
}

/* ------------------------------------------------------------------ *
 *  Piece animation
 * ------------------------------------------------------------------ */
const _float = { pos: new THREE.Vector3(), rotX: 0, rotY: 0, rotZ: 0 };

function floatPose(it, t, out) {
  out.pos.set(
    it.basePos.x + Math.sin(t * 0.72 + it.phase) * 0.085,
    it.basePos.y + Math.sin(t * 0.98 + it.phase * 1.7) * 0.135,
    it.basePos.z + Math.cos(t * 0.58 + it.phase * 0.8) * 0.085
  );
  out.rotX = Math.sin(t * 0.80 + it.phase) * 0.18;
  out.rotY = it.startRotY + t * it.spin;
  out.rotZ = Math.cos(t * 0.66 + it.phase) * 0.16;
  return out;
}

function updatePieces(t) {
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const o = it.obj;

    if (t < it.t0) {
      // drifting in place, bobbing slowly, awaiting its turn
      floatPose(it, t, _float);
      o.position.copy(_float.pos);
      o.rotation.set(_float.rotX, _float.rotY, _float.rotZ);
      continue;
    }

    const p = Math.min(1, (t - it.t0) / it.dur);
    const e = easeInOutCubic(p);
    floatPose(it, it.t0, _float);

    // position: eased drift inward with a soft arc
    o.position.lerpVectors(_float.pos, it.restPos, e);
    o.position.y += Math.sin(Math.PI * e) * it.arc;

    // rotation: quaternion-free eased lerp with decaying tumble
    const wob = 0.10 * (1 - e);
    o.rotation.set(
      lerp(_float.rotX, it.restRot.x, e) + Math.sin(t * 2.2 + it.phase) * wob,
      lerp(_float.rotY, it.restRot.y, e),
      lerp(_float.rotZ, it.restRot.z, e) + Math.cos(t * 1.9 + it.phase) * wob * 0.9
    );

    if (p >= 1) {
      // micro settle bounce, damped to stillness
      const s = t - it.t0 - it.dur;
      const damp = Math.exp(-s * 7.0);
      o.position.y = it.restPos.y + Math.sin(s * 18.0) * 0.011 * damp;
      o.rotation.x = it.restRot.x + Math.sin(s * 11.0) * 0.035 * damp;
      o.rotation.z = it.restRot.z + Math.sin(s * 13.0) * 0.045 * damp;
    }
  }
}

/* ------------------------------------------------------------------ *
 *  Resize
 * ------------------------------------------------------------------ */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);

  if (composer) {
    composer.setPixelRatio(dpr);
    composer.setSize(w, h);
    if (bokehPass && bokehPass.uniforms && bokehPass.uniforms.aspect) {
      bokehPass.uniforms.aspect.value = camera.aspect;
    }
  }
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

/* ------------------------------------------------------------------ *
 *  Loop
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
let elapsed = 0;

// prime camera before first frame
updateCamera(0, 0);

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updatePieces(elapsed);
  updateCamera(elapsed, dt);

  // keep the board sharp while the camera arcs and the pieces drift
  if (bokehPass && bokehPass.uniforms && bokehPass.uniforms.focus) {
    bokehPass.uniforms.focus.value = camera.position.distanceTo(camTarget);
  }

  if (composer) composer.render();
  else renderer.render(scene, camera);
}

onResize();
animate();
</script>
</body>
